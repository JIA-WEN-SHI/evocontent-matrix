[project]
name = "evocontent-agent"
version = "0.1.0"
description = "LangGraph worker service for EvoContent Matrix"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "supabase==2.28.0",
  "httpx==0.28.1",
  "langgraph>=0.2.31",
  "openai>=1.37.0",
  "anthropic>=0.31.2",
  "playwright>=1.45.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
